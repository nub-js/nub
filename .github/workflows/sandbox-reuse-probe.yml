name: Reusable sandbox native gates

on:
  push:
    branches: [sandbox-reuse-epic]
    paths:
      - crates/nub-sandbox/**
      - .github/workflows/sandbox-reuse-probe.yml
      - Cargo.lock
      - Cargo.toml
      - scripts/sandbox-tool-fixtures.mjs
      - scripts/sandbox-python-fixtures.mjs
      - scripts/sandbox-native-tool-fixtures.mjs

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      SANDBOX_PARENT_SECRET: synthetic-parent-canary
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: sandbox-reuse-native
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22.18.0'
      - name: Recording the native environment
        run: |
          mkdir -p reports
          { git rev-parse HEAD; rustc -Vv; uname -a; id; } > reports/environment.txt
      - name: Checking all sandbox targets
        run: |
          set -o pipefail
          cargo clippy -p nub-sandbox --profile fast --all-targets --all-features -- -D warnings 2>&1 | tee reports/clippy.log
      - name: Exercising native sandbox contracts
        if: success() || failure()
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --no-fail-fast -- --nocapture 2>&1 | tee reports/tests.log
      - name: Exercising Linux notification lifecycle
        if: (success() || failure()) && runner.os == 'Linux'
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast native_supervised_streams_status_and_repeated_launches -- --ignored --nocapture 2>&1 | tee reports/linux-notification.log
      - name: Measuring native acquisition and reuse
        if: success() || failure()
        env:
          NUB_SANDBOX_WIN_TIMING: '1'
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --test lifecycle_costs native_session_costs_and_unique_policy_churn -- --ignored --nocapture --test-threads=1 2>&1 | tee reports/costs.log
      - name: Provisioning pinned package managers
        id: tools
        if: success() || failure()
        run: |
          set -o pipefail
          node scripts/sandbox-tool-fixtures.mjs 2>&1 | tee reports/tools-provision.log
          cp .sandbox-tool-fixtures/matrix.json reports/tools-matrix.json
      - name: Exercising package-manager functionality
        timeout-minutes: 8
        if: (success() || failure()) && steps.tools.outcome == 'success'
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --test tool_functionality -- --ignored --nocapture --test-threads=1 --skip linux_tool_bundle_release_costs 2>&1 | tee reports/tools.log
      - name: Provisioning pinned Python tools
        id: python-tools
        if: success() || failure()
        run: |
          set -o pipefail
          node scripts/sandbox-python-fixtures.mjs 2>&1 | tee reports/python-provision.log
          cp .sandbox-python-fixtures/matrix.json reports/python-matrix.json
      - name: Exercising Python tool functionality
        timeout-minutes: 8
        if: (success() || failure()) && steps.python-tools.outcome == 'success'
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --test python_tool_functionality -- --ignored --nocapture --test-threads=1 2>&1 | tee reports/python-tools.log
      - name: Exercising Git tool functionality
        timeout-minutes: 8
        if: success() || failure()
        run: |
          set -o pipefail
          git --version > reports/git-version.txt
          git lfs version >> reports/git-version.txt
          cargo test -p nub-sandbox --profile fast --test git_tool_functionality -- --ignored --nocapture --test-threads=1 2>&1 | tee reports/git-tools.log
      - name: Recording Linux Bun syscall evidence
        if: (success() || failure()) && runner.os == 'Linux' && steps.tools.outcome == 'success'
        timeout-minutes: 5
        run: |
          command -v strace
          set +e
          strace -f -s 256 -e trace=%file,%process,prlimit64 -o reports/bun140-syscalls.log cargo test -p nub-sandbox --profile fast --test tool_functionality bun140_tooldirs_normal_operations -- --ignored --exact --nocapture > reports/bun140-traced-result.log 2>&1
          printf 'exit=%s\n' "$?" >> reports/bun140-traced-result.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sandbox-reuse-${{ matrix.os }}
          path: reports
          retention-days: 30

  toolchains:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: sandbox-reuse-native
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: 26
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21.0.8'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.100'
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: '8.4'
          coverage: none
      - name: Provisioning pinned native toolchains
        id: tools
        run: |
          set -o pipefail
          mkdir -p reports
          node scripts/sandbox-native-tool-fixtures.mjs 2>&1 | tee reports/native-provision.log
          cp .sandbox-native-tool-fixtures/matrix.json reports/native-matrix.json
      - name: Exercising native toolchain functionality
        if: (success() || failure()) && steps.tools.outcome == 'success'
        timeout-minutes: 15
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --test native_tool_functionality -- --ignored --nocapture --test-threads=1 2>&1 | tee reports/native-tools.log
      - name: Recording Linux CoreCLR syscall evidence
        if: (success() || failure()) && runner.os == 'Linux' && steps.tools.outcome == 'success'
        timeout-minutes: 5
        run: |
          command -v strace
          set +e
          strace -f -s 256 -e trace=%file,%process,prlimit64 -o reports/nuget-syscalls.log cargo test -p nub-sandbox --profile fast --test native_tool_functionality nuget_tooldirs -- --ignored --exact --nocapture > reports/nuget-traced-result.log 2>&1
          printf 'exit=%s\n' "$?" >> reports/nuget-traced-result.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: sandbox-toolchains-${{ matrix.os }}
          path: reports
          retention-days: 30
