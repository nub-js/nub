name: Sandbox subprocess diagnostics

on:
  push:
    branches: [sandbox-runtime-diagnosis]
    paths:
      - crates/nub-sandbox/tests/windows_subprocess_diagnostics.rs
      - .github/workflows/sandbox-subprocess-diagnostics.yml

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: sandbox-reuse-native
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.12.10'
          architecture: x64
      - name: Recording interpreter locations
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports | Out-Null
          git rev-parse HEAD | Out-File reports/environment.txt
          rustc -Vv | Out-File -Append reports/environment.txt
          python --version | Out-File -Append reports/environment.txt
          $sysroot = (rustc --print sysroot).Trim()
          $python = (Get-Command python.exe).Source
          @(
            @{name='rustc'; program="$sysroot\bin\rustc.exe"; args=@('-vV'); root=$sysroot},
            @{name='python'; program=$python; args=@('-I','-c','print("PYTHON_CHILD_OK")'); root=(Split-Path $python)}
          ) | ConvertTo-Json -Depth 4 | Out-File -Encoding utf8 reports/interpreters.json
          "SANDBOX_DIAG_MATRIX=$env:GITHUB_WORKSPACE\reports\interpreters.json" >> $env:GITHUB_ENV
      - name: Checking diagnostic target
        shell: bash
        run: |
          set -o pipefail
          cargo clippy -p nub-sandbox --profile fast --test windows_subprocess_diagnostics -- -D warnings 2>&1 | tee reports/clippy.log
      - name: Comparing subprocess startup operations
        shell: bash
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --test windows_subprocess_diagnostics windows_subprocess_startup_controls -- --ignored --nocapture --test-threads=1 2>&1 | tee reports/diagnostics.log
      - name: Preserving diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: subprocess-${{ matrix.os }}
          path: reports
