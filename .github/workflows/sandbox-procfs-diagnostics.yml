name: Sandbox procfs diagnostics

on:
  push:
    branches: [sandbox-procfs-diagnosis]
    paths:
      - scripts/sandbox-procfs-diagnostics.py
      - .github/workflows/sandbox-procfs-diagnostics.yml

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.100'
      - name: Provisioning diagnostic tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y strace
          npm install --prefix .sandbox-procfs-tools --no-audit --no-fund @oven/bun-linux-x64@1.4.0
          mkdir -p reports
          git rev-parse HEAD > reports/environment.txt
          uname -a >> reports/environment.txt
          strace --version >> reports/environment.txt
          node --version >> reports/environment.txt
          dotnet --info >> reports/environment.txt
          .sandbox-procfs-tools/node_modules/@oven/bun-linux-x64/bin/bun --version >> reports/environment.txt
      - name: Isolating selected procfs and FIFO failures
        env:
          BUN_DIAGNOSTIC_BIN: .sandbox-procfs-tools/node_modules/@oven/bun-linux-x64/bin/bun
        run: python3 scripts/sandbox-procfs-diagnostics.py
      - name: Preserving syscall and runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: procfs-linux
          path: reports
