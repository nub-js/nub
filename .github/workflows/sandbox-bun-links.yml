name: Sandbox Windows Bun link controls

on:
  push:
    branches: [sandbox-bun-links]
    paths:
      - crates/nub-sandbox/**
      - .github/workflows/sandbox-bun-links.yml

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: sandbox-reuse-native
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - name: Provisioning pinned tools
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/environment.txt
          rustc -Vv >> reports/environment.txt
          node scripts/sandbox-tool-fixtures.mjs > reports/provision.log 2>&1
          cp .sandbox-tool-fixtures/matrix.json reports/matrix.json
      - name: Checking all sandbox targets
        run: cargo clippy -p nub-sandbox --profile fast --all-targets --all-features -- -D warnings
      - name: Comparing package sources and link primitives
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --test tool_functionality windows_bun140_link_primitives_and_global_sources -- --ignored --nocapture --test-threads=1 2>&1 | tee reports/bun-links.log
      - name: Preserving native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bun-links-${{ matrix.os }}
          path: reports
