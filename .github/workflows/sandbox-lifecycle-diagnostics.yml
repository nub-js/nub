name: Sandbox lifecycle diagnostics

on:
  push:
    branches: [sandbox-lifecycle-diagnosis]
    paths:
      - crates/nub-sandbox/src/**
      - .github/workflows/sandbox-lifecycle-diagnostics.yml

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: sandbox-reuse-native
      - name: Recording source and platform
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/environment.txt
          rustc -Vv >> reports/environment.txt
      - name: Checking all sandbox targets
        run: |
          set -o pipefail
          cargo clippy -p nub-sandbox --profile fast --all-targets --all-features -- -D warnings 2>&1 | tee reports/clippy.log
      - name: Exercising concurrent native library contracts
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --lib -- --nocapture 2>&1 | tee reports/native.log
      - name: Preserving lifecycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lifecycle-${{ matrix.os }}
          path: reports
