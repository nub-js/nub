name: compile-cache-probe
on:
  push:
    branches: [compile-opencode-cache]
    paths:
      - '.github/workflows/compile-cache-probe.yml'
      - 'crates/nub-cli/src/compile/code_cache*'
  workflow_dispatch:
permissions: {}
jobs:
  cache:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        node: ['24', '26']
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}
      - run: node --test crates/nub-cli/src/compile/code_cache.test.cjs
  compiler:
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      CARGO_PROFILE_FAST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '26'
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: compile-cache-probe
          workspaces: |
            .
            crates/nub-native
            crates/nub-launcher
      - name: Stage the runtime
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --loglevel=error
          (cd crates/nub-native && cargo build --profile fast)
          mkdir -p runtime/addons
          cp target/fast/libnub_native.dylib runtime/addons/nub-native.node
          mkdir -p runtime/node_modules
          for package in @oxc-project/runtime urlpattern-polyfill @js-temporal/polyfill @petamoriken/float16 jsbi; do
            mkdir -p "runtime/node_modules/$(dirname "$package")"
            cp -RL "node_modules/$package" "runtime/node_modules/$package"
          done
      - name: Build the launcher template
        run: cd crates/nub-launcher && cargo build --locked --release
      - name: Build merge-base and modified compilers
        env:
          HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          mkdir -p dist
          git checkout --detach 250372c9dd
          cargo build -p nub-cli --profile fast --features compile,embed-runtime
          cp target/fast/nub dist/nub-before
          git rev-parse HEAD > dist/before-commit
          git checkout --detach "$HEAD"
          cargo build -p nub-cli --profile fast --features compile,embed-runtime
          cp target/fast/nub dist/nub-after
          git rev-parse HEAD > dist/after-commit
          cp crates/nub-launcher/target/release/nub-launcher dist/nub-launcher
          cp runtime/addons/nub-native.node dist/nub-native.node
          codesign --verify dist/nub-before
          codesign --verify dist/nub-after
          (cd dist && shasum -a 256 nub-before nub-after nub-launcher nub-native.node > SHA256SUMS)
          dist/nub-before compile --help
          dist/nub-after compile --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compile-cache-macos
          path: dist/
          retention-days: 7
          if-no-files-found: error
