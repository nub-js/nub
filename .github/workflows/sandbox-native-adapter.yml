name: Sandbox native API adapter probe

on:
  push:
    branches: [sandbox-native-adapter]
    paths:
      - crates/nub-sandbox/**
      - tests/sandbox-native-adapter/**
      - .github/workflows/sandbox-native-adapter.yml

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          repository: microsoft/Detours
          ref: adb07604aa56508448b95bf037c2a6d0d3b6831a
          path: .probe-detours
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: sandbox-reuse-native
      - name: Building the isolated native probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force reports, .native-adapter | Out-Null
          git rev-parse HEAD > reports/environment.txt
          rustc -Vv >> reports/environment.txt
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          $arch = if ($env:RUNNER_ARCH -eq 'ARM64') { 'amd64_arm64' } else { 'amd64' }
          $lib = if ($env:RUNNER_ARCH -eq 'ARM64') { 'ARM64' } else { 'X64' }
          $root = $env:GITHUB_WORKSPACE
          @"
          @echo off
          call "$vs\VC\Auxiliary\Build\vcvarsall.bat" $arch
          if errorlevel 1 exit /b 1
          cd /d "$root\.probe-detours\src"
          nmake
          if errorlevel 1 exit /b 1
          cd /d "$root\.native-adapter"
          cl /nologo /std:c++17 /W4 /WX /MT /EHsc /I"$root\.probe-detours\include" "$root\tests\sandbox-native-adapter\probe.cpp" /LD /link "$root\.probe-detours\lib.$lib\detours.lib" /OUT:probe.dll /EXPORT:ProbeMarker,@1
          if errorlevel 1 exit /b 1
          cl /nologo /std:c++17 /W4 /WX /MT /EHsc /DPROBE_INJECTOR /I"$root\.probe-detours\include" "$root\tests\sandbox-native-adapter\probe.cpp" /Fe:injector.exe /link "$root\.probe-detours\lib.$lib\detours.lib"
          "@ | Set-Content .native-adapter/build.cmd
          cmd /c .native-adapter/build.cmd *> reports/native-build.log
          if ($LASTEXITCODE -ne 0) { Get-Content reports/native-build.log; exit $LASTEXITCODE }
          "NUB_NATIVE_ADAPTER_PROBE_DIR=$root\.native-adapter" >> $env:GITHUB_ENV
          Get-FileHash .native-adapter/probe.dll, .native-adapter/injector.exe >> reports/environment.txt
      - name: Checking sandbox targets
        shell: bash
        run: cargo clippy -p nub-sandbox --profile fast --all-targets --all-features -- -D warnings
      - name: Comparing raw and adapted native operations
        shell: bash
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --lib native_adapter_primitives_with_raw_and_plain_controls -- --ignored --nocapture --test-threads=1 2>&1 | tee reports/native-adapter.log
      - name: Preserving native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-adapter-${{ matrix.os }}
          path: reports
