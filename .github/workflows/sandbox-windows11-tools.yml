name: Sandbox Windows 11 native tools

on:
  push:
    branches: [sandbox-windows11-tools]
    paths:
      - .github/workflows/sandbox-windows11-tools.yml

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-11-arm
    timeout-minutes: 35
    env:
      # The runner is ARM64; this matrix deliberately exercises x64 tools under
      # Windows emulation with the matching MSVC libraries.
      RUSTUP_OVERRIDE_HOST_TRIPLE: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: stable-x86_64-pc-windows-msvc
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: sandbox-windows11-x64-tools
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '26'
          architecture: x64
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21.0.8'
          architecture: x64
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.100'
      - uses: shivammathur/setup-php@b604ade2a87db23f8871b7182e69ec5e75effb45
        with:
          php-version: '8.4'
          coverage: none
      - name: Provisioning pinned native toolchains
        id: tools
        run: |
          set -o pipefail
          mkdir -p reports
          # Unqualified pinned toolchain names must use the same x64 host as
          # this probe's MSVC environment, not the runner's native ARM default.
          rustup set default-host x86_64-pc-windows-msvc
          git rev-parse HEAD > reports/environment.txt
          rustc -Vv >> reports/environment.txt
          node -p 'process.platform + " " + process.arch' >> reports/environment.txt
          dotnet --info >> reports/environment.txt
          node scripts/sandbox-native-tool-fixtures.mjs 2>&1 | tee reports/provision.log
          cp .sandbox-native-tool-fixtures/matrix.json reports/native-matrix.json
      - name: Checking native tool target
        run: |
          set -o pipefail
          cargo clippy -p nub-sandbox --profile fast --test native_tool_functionality -- -D warnings 2>&1 | tee reports/clippy.log
      - name: Verifying selected SDK and native operations
        if: ${{ !cancelled() && steps.tools.outcome == 'success' }}
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --test native_tool_functionality nuget_ -- --ignored --nocapture --test-threads=1 2>&1 | tee reports/native-tools.log
      - name: Preserving Windows 11 tool evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows11-native-tools
          path: reports
