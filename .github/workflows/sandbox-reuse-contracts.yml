name: Sandbox lifecycle contracts

on:
  push:
    branches: [sandbox-reuse-contracts]
    paths:
      - crates/nub-sandbox/**
      - .github/workflows/sandbox-reuse-contracts.yml

permissions:
  contents: read

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
    env:
      SANDBOX_PARENT_SECRET: synthetic-parent-canary
      WITHHELD_AMBIENT_SECRET: synthetic-procfs-canary
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: sandbox-reuse-native
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.18.0'
      - name: Recording source and platform
        run: |
          mkdir -p reports
          { git rev-parse HEAD; rustc -Vv; uname -a; id; } > reports/environment.txt
      - name: Checking all sandbox targets
        run: |
          set -o pipefail
          cargo clippy -p nub-sandbox --profile fast --all-targets --all-features -- -D warnings 2>&1 | tee reports/clippy.log
      - name: Exercising lifecycle and enforcement contracts
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --no-fail-fast -- --nocapture 2>&1 | tee reports/contracts.log
      - name: Preserving native evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sandbox-contracts-${{ matrix.os }}
          path: reports
