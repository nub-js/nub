name: Sandbox Git runtime grants

on:
  push:
    branches: [sandbox-git-runtime]
    paths:
      - crates/nub-sandbox/tests/git_tool_functionality.rs
      - crates/nub-sandbox/tests/windows_subprocess_diagnostics.rs
      - .github/workflows/sandbox-git-runtime.yml

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: sandbox-reuse-native
      - name: Recording Git versions
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/environment.txt
          git --version >> reports/environment.txt
          git lfs version >> reports/environment.txt
          git --exec-path >> reports/environment.txt
          rustc -Vv >> reports/environment.txt
      - name: Checking Git fixture
        run: |
          set -o pipefail
          cargo clippy -p nub-sandbox --profile fast --test git_tool_functionality --test windows_subprocess_diagnostics -- -D warnings 2>&1 | tee reports/clippy.log
      - name: Preparing shell startup controls
        shell: pwsh
        run: |
          $execPath = (git --exec-path).Trim()
          $install = Split-Path (Split-Path (Split-Path $execPath))
          $sh = Join-Path $install 'usr/bin/sh.exe'
          if (!(Test-Path $sh)) { throw "Git shell missing: $sh" }
          @(
            @{name='git'; program=(Get-Command git.exe).Source; args=@('--version'); root=$install},
            @{name='sh-builtin'; program=$sh; args=@('-c','printf SHELL_BUILTIN_OK'); root=$install},
            @{name='sh-child'; program=$sh; args=@('-c','git --version'); root=$install}
          ) | ConvertTo-Json -Depth 4 | Out-File -Encoding utf8 reports/interpreters.json
          "SANDBOX_DIAG_MATRIX=$env:GITHUB_WORKSPACE\reports\interpreters.json" >> $env:GITHUB_ENV
      - name: Comparing Git and shell startup
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --test windows_subprocess_diagnostics windows_subprocess_startup_controls -- --ignored --nocapture --test-threads=1 2>&1 | tee reports/git-startup.log
      - name: Preserving Git evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: git-runtime-${{ matrix.os }}
          path: reports
