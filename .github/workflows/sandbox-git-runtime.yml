name: Sandbox Git runtime grants

on:
  push:
    branches: [sandbox-git-runtime]
    paths:
      - crates/nub-sandbox/tests/git_tool_functionality.rs
      - .github/workflows/sandbox-git-runtime.yml

permissions:
  contents: read

jobs:
  windows:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          shared-key: sandbox-reuse-native
      - name: Recording Git versions
        run: |
          mkdir -p reports
          git rev-parse HEAD > reports/environment.txt
          git --version >> reports/environment.txt
          git lfs version >> reports/environment.txt
          git --exec-path >> reports/environment.txt
          rustc -Vv >> reports/environment.txt
      - name: Checking Git fixture
        run: |
          set -o pipefail
          cargo clippy -p nub-sandbox --profile fast --test git_tool_functionality -- -D warnings 2>&1 | tee reports/clippy.log
      - name: Comparing explicit Git installation grants
        run: |
          set -o pipefail
          cargo test -p nub-sandbox --profile fast --test git_tool_functionality git_windows_complete_runtime -- --ignored --nocapture --test-threads=1 2>&1 | tee reports/git-runtime.log
      - name: Preserving Git evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: git-runtime-${{ matrix.os }}
          path: reports
